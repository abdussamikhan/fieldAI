[server]
maxUploadSize = 500
enableCORS = false
enableXsrfProtection = true
headless = true
runOnSave = false
fileWatcherType = "none"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0284c7"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
font = "sans serif"
