services:
  # 1. FieldAI Web Service (Streamlit UI)
  - type: web
    name: fieldai-web
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.fileWatcherType none --client.toolbarMode minimal
    envVars:
      - fromGroup: fieldai-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: fieldai-db
          property: connectionString

  # 2. FieldAI Background Worker (LangGraph Job Runner)
  - type: worker
    name: fieldai-worker
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    dockerCommand: python worker.py
    envVars:
      - fromGroup: fieldai-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: fieldai-db
          property: connectionString

  # 3. FieldAI Recurring Monitoring Cron Job
  - type: cron
    name: fieldai-monitoring
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    schedule: "0 2 * * 1" # Weekly every Monday at 02:00 UTC
    dockerCommand: python jobs/run_monitoring.py
    envVars:
      - fromGroup: fieldai-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: fieldai-db
          property: connectionString

# 4. FieldAI PostgreSQL Database
databases:
  - name: fieldai-db
    databaseName: fieldai
    user: fieldai_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

# 5. Shared Secrets Environment Group
envVarGroups:
  - name: fieldai-secrets
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
